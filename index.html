<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout html 5- iframe</title>
<style>
    body{ 
        margin: 0;
        font-family: arial, sans-serif;
        background-color: whitesmoke;
        display: flex;
        height: 100vh;
    }
    nav {
        width: 25%;
        background-color: pink;
        padding: 20px;
    }
    iframe {
        width: 75%;
        border: none;
        height: 100vh;
    }
    a {
        display: block;
        margin: 10px 0;
        text-decoration: none;
        color: #333;
    }
    a:hover {
            color: maroon;
            transform: translateX(5px);
            transition: transform 0.2s ease;
        }   
</style>
</head>
</body>

    <nav>
        <h3>MENU</h3>
        <a href="beranda.html" target="berandaFrame">beranda</a>
        <a href="profil.html" target="berandaFrame">profil</a>
        <a href="kontak.html" target="berandaFrame">kontak</a>
    </nav>
    <iframe name ="berandaFrame" src="beranda.html"></iframe>
</body>
</html>
